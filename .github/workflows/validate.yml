name: Validate Raksha Atlas

on:
  push:
    branches: [work/step-1-foundation]
  pull_request:
    branches: [work/step-1-foundation]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run automated test suite
        run: npm test
      - name: Build website
        run: npm run build
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install AI service test dependencies
        run: pip install -r ai/requirements-dev.txt
      - name: Test document extraction worker
        run: pytest -q
