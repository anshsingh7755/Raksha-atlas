services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: raksha_atlas
      POSTGRES_USER: raksha
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - raksha-postgres:/var/lib/postgresql/data
      - ./database/seeds/01-create-databases.sql:/docker-entrypoint-initdb.d/01-create-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raksha -d defence_db"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks: [private]

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      DATABASE_URL: postgresql://raksha:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/defence_db
      DEFENCE_DATABASE_URL: postgresql://raksha:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/defence_db
      APPLICATION_DATABASE_URL: postgresql://raksha:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/application_db
      DATABASE_SSL: "false"
      TRUST_PROXY: "true"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:8080}
      RAKSHA_ADMIN_TOKEN: ${RAKSHA_ADMIN_TOKEN:?Set RAKSHA_ADMIN_TOKEN in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-astra}
      OPENAI_SUMMARY_MODEL: ${OPENAI_SUMMARY_MODEL:-gpt-6-luna}
      RAG_WEB_SEARCH: ${RAG_WEB_SEARCH:-true}
      AI_ENRICH_LIMIT: ${AI_ENRICH_LIMIT:-10}
      METADATA_EXTRACT_LIMIT: ${METADATA_EXTRACT_LIMIT:-12}
      YOUTUBE_SEARCHES_PER_RUN: ${YOUTUBE_SEARCHES_PER_RUN:-1}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      X_BEARER_TOKEN: ${X_BEARER_TOKEN:-}
      DOCUMENT_EXTRACTION_URL: http://ai:8001
      DOCUMENT_WORKER_TOKEN: ${DOCUMENT_WORKER_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_healthy
    expose: ["8787"]
    networks: [private]

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DOCUMENT_WORKER_TOKEN: ${DOCUMENT_WORKER_TOKEN:-}
      DOCUMENT_ALLOWED_HOSTS: ${DOCUMENT_ALLOWED_HOSTS:-}
      DOCUMENT_MAX_FILE_BYTES: ${DOCUMENT_MAX_FILE_BYTES:-26214400}
      DOCUMENT_MAX_PAGES: ${DOCUMENT_MAX_PAGES:-300}
      DOCUMENT_MAX_TEXT_CHARS: ${DOCUMENT_MAX_TEXT_CHARS:-200000}
      DOCUMENT_MAX_OCR_PAGES: ${DOCUMENT_MAX_OCR_PAGES:-20}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-raksha-ai}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    expose: ["8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [private]

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${WEB_PORT:-8080}:80"
    networks: [private]

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - raksha-prometheus:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      ai:
        condition: service_healthy
    networks: [private]

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - raksha-grafana:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on: [prometheus]
    networks: [private]

  redis:
    profiles: ["cache"]
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - raksha-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    expose: ["6379"]
    networks: [private]

volumes:
  raksha-postgres:
  raksha-redis:
  raksha-prometheus:
  raksha-grafana:

networks:
  private:
    driver: bridge


