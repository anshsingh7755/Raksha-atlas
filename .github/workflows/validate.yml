name: Validate Raksha Atlas

on:
  push:
    branches: [work/step-1-foundation]
  pull_request:
    branches: [work/step-1-foundation]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run news pipeline tests
        run: npm test
      - name: Build website
        run: npm run build
