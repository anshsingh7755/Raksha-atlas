spring:
  application:
    name: raksha-atlas-backend
  datasource:
    url: ${DB_JDBC_URL:jdbc:postgresql://localhost:5432/raksha_atlas}
    username: ${DB_USERNAME:raksha}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8081}

# JWT is mandatory for protected API routes. Supply a secret of at least 32 bytes.
raksha:
  security:
    jwt-secret: ${RAKSHA_JWT_SECRET:}
    issuer: ${RAKSHA_JWT_ISSUER:raksha-atlas}
  cache:
    redis-enabled: ${RAKSHA_REDIS_CACHE_ENABLED:false}

