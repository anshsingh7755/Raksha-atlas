services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: raksha_atlas
      POSTGRES_USER: raksha
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - raksha-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raksha -d raksha_atlas"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks: [private]

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      DATABASE_URL: postgresql://raksha:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/raksha_atlas
      DATABASE_SSL: "false"
      TRUST_PROXY: "true"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:8080}
      RAKSHA_ADMIN_TOKEN: ${RAKSHA_ADMIN_TOKEN:?Set RAKSHA_ADMIN_TOKEN in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-astra}
      OPENAI_SUMMARY_MODEL: ${OPENAI_SUMMARY_MODEL:-gpt-6-luna}
      RAG_WEB_SEARCH: ${RAG_WEB_SEARCH:-true}
      AI_ENRICH_LIMIT: ${AI_ENRICH_LIMIT:-10}
      METADATA_EXTRACT_LIMIT: ${METADATA_EXTRACT_LIMIT:-12}
      YOUTUBE_SEARCHES_PER_RUN: ${YOUTUBE_SEARCHES_PER_RUN:-1}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      X_BEARER_TOKEN: ${X_BEARER_TOKEN:-}
      DOCUMENT_EXTRACTION_URL: http://ai:8001
      DOCUMENT_WORKER_TOKEN: ${DOCUMENT_WORKER_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_healthy
    expose: ["8787"]
    networks: [private]

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DOCUMENT_WORKER_TOKEN: ${DOCUMENT_WORKER_TOKEN:-}
      DOCUMENT_ALLOWED_HOSTS: ${DOCUMENT_ALLOWED_HOSTS:-}
      DOCUMENT_MAX_FILE_BYTES: ${DOCUMENT_MAX_FILE_BYTES:-26214400}
      DOCUMENT_MAX_PAGES: ${DOCUMENT_MAX_PAGES:-300}
      DOCUMENT_MAX_TEXT_CHARS: ${DOCUMENT_MAX_TEXT_CHARS:-200000}
      DOCUMENT_MAX_OCR_PAGES: ${DOCUMENT_MAX_OCR_PAGES:-20}
    expose: ["8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [private]

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${WEB_PORT:-8080}:80"
    networks: [private]

  backend:
    profiles: ["migration"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
      DB_JDBC_URL: jdbc:postgresql://db:5432/raksha_atlas
      DB_USERNAME: raksha
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      RAKSHA_JWT_SECRET: ${RAKSHA_JWT_SECRET:?Set a local-only JWT secret in .env}
      RAKSHA_AI_BASE_URL: http://ai:8001
      RAKSHA_AI_SERVICE_TOKEN: ${RAKSHA_AI_SERVICE_TOKEN:-}
      RAKSHA_AI_ENABLED: "false"
      RAKSHA_REDIS_CACHE_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_healthy
    expose: ["8081"]
    networks: [private]

  redis:
    profiles: ["cache"]
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - raksha-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    expose: ["6379"]
    networks: [private]

volumes:
  raksha-postgres:
  raksha-redis:

networks:
  private:
    driver: bridge
