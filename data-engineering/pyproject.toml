[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raksha-atlas-data-engineering"
version = "0.3.0"
description = "Parallel public-source ingestion and analytics pipelines for Raksha Atlas."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
analytics = ["polars>=1.20,<2", "pyarrow>=18,<25"]
events = ["confluent-kafka>=2.6,<3"]
orchestration = ["apache-airflow>=2.10,<4"]
dbt = ["dbt-core>=1.9,<2", "dbt-postgres>=1.9,<2"]
quality = ["great-expectations>=1.3,<2"]
scale = ["pyspark>=3.5,<5", "pyiceberg>=0.8,<1"]
all = [
  "psycopg[binary]>=3.2,<4", "polars>=1.20,<2", "pyarrow>=18,<25",
  "confluent-kafka>=2.6,<3", "great-expectations>=1.3,<2"
]

[project.scripts]
raksha-pipeline = "pipeline.main:main"
