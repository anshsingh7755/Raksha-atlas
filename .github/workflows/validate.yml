name: Validate Raksha Atlas

on:
  push:
    branches: [work/step-1-foundation]
  pull_request:
    branches: [work/step-1-foundation]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run automated test suite
        run: npm test
      - name: Test frontend route and API response contracts
        run: node --test frontend/tests/*.test.mjs src/services/*.test.mjs
      - name: Build website
        run: npm run build
      - name: Install Next.js frontend dependencies
        run: npm ci --prefix frontend
      - name: Type-check Next.js frontend
        run: npm run typecheck --prefix frontend
      - name: Build Next.js frontend
        run: npm run build --prefix frontend
      - name: Validate Docker Compose configuration
        env:
          DB_PASSWORD: test-database-password
          RAKSHA_ADMIN_TOKEN: test-admin-token
        run: docker compose config --quiet
      - name: Build document extraction worker image
        run: docker build -t raksha-atlas-ai-test -f ai/Dockerfile ai
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install AI service test dependencies
        run: pip install -r ai/requirements-dev.txt
      - name: Test document extraction worker
        run: pytest -q -c ai/pytest.ini ai/tests
