name: Validate Raksha Atlas

on:
  push:
    branches: [work/step-1-foundation]
  pull_request:
    branches: [work/step-1-foundation]

permissions:
  contents: read

concurrency:
  group: raksha-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile and test Spring Boot backend
        run: mvn -B -f backend/pom.xml test
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run automated test suite
        run: npm test
      - name: Validate PostgreSQL import and reconciliation scripts
        run: |
          npm run db:import
          node --check scripts/reconcile-domain-data.mjs
      - name: Test frontend route and API response contracts
        run: node --test frontend/tests/*.test.mjs src/services/*.test.mjs
      - name: Build website
        run: npm run build
      - name: Install Next.js frontend dependencies
        run: npm ci --prefix frontend
      - name: Type-check Next.js frontend
        run: npm run typecheck --prefix frontend
      - name: Build Next.js frontend
        run: npm run build --prefix frontend
      - name: Smoke-test Next.js direct routes
        run: |
          npm run start --prefix frontend > /tmp/raksha-next.log 2>&1 &
          NEXT_PID=$!
          trap 'kill "$NEXT_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 2
          done
          for route in / /commands /theatre-atlas /inventory /programmes /articles /briefs /documents /sources /procurement /timeline /watch /pib /register /history; do
            status=$(curl -sS -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000$route")
            if [ "$status" != "200" ]; then
              cat /tmp/raksha-next.log
              echo "Expected HTTP 200 for $route, got $status"
              exit 1
            fi
          done
          unknown_status=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/not-a-real-route)
          if [ "$unknown_status" != "404" ]; then
            echo "Expected HTTP 404 for unknown route, got $unknown_status"
            exit 1
          fi
      - name: Validate Docker Compose configuration
        env:
          DB_PASSWORD: test-database-password
          RAKSHA_ADMIN_TOKEN: test-admin-token
          RAKSHA_JWT_SECRET: local-ci-only-secret-value-at-least-32-characters
          GRAFANA_ADMIN_PASSWORD: local-ci-grafana-password
        run: docker compose config --quiet
      - name: Build service container images
        run: |
          docker build -t raksha-atlas-ai-test -f ai/Dockerfile ai
          docker build -t raksha-atlas-backend-test -f backend/Dockerfile backend
          docker build -t raksha-atlas-next-test -f frontend/Dockerfile .
      - name: Validate Terraform AWS foundation
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform format and static validation
        working-directory: infrastructure/aws/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test Python data-engineering pipeline
        run: |
          cd data-engineering
          python -m unittest discover -s tests -v
          python -m pipeline.main --check
      - name: Install AI service test dependencies
        run: pip install -r ai/requirements-dev.txt
      - name: Test document extraction worker
        run: pytest -q -c ai/pytest.ini ai/tests
